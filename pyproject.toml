[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harbormaster"
version = "0.2.0"
description = "Port allocation daemon for developers and AI agents"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.41",
    "uvicorn>=0.32",
    "psutil>=6.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "textual>=0.80",
    "mcp>=1.2",
]

[project.scripts]
harbormasterd = "harbormaster.daemon:main"
harbor = "harbormaster.tui.app:main"
hm = "harbormaster.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
