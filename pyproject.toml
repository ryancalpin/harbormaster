[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harbormaster"
version = "0.2.0"
description = "Port allocation daemon for developers and AI agents"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "starlette>=0.41",
    "uvicorn>=0.32",
    "psutil>=6.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "textual>=0.80",
    "mcp>=1.2",
    "shtab>=1.6",
]

[project.urls]
Homepage = "https://github.com/ryanc/harbormaster"
Source = "https://github.com/ryanc/harbormaster"
"Bug Tracker" = "https://github.com/ryanc/harbormaster/issues"

[project.scripts]
harbormasterd = "harbormaster.daemon:main"
harbor = "harbormaster.tui.app:main"
hm = "harbormaster.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: Integration tests that spin up a live daemon subprocess",
]
